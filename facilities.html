{% extends "base.html" %}

{% block content %}

<h2>🏥 Healthcare Facilities</h2>

<p class="text-muted">
    Basic hospital, clinic and blood-bank information.
</p>


<div class="row g-4 mt-2">

{% for facility in facilities %}

    <div class="col-md-4">

        <div class="card h-100">

            <div class="card-body">

                <h4>
                    {{ facility.name }}
                </h4>

                <span class="badge bg-primary">

                    {{ facility.type }}

                </span>


                <hr>


                <p>
                    📍 {{ facility.location }}
                </p>

                <p>
                    📞 {{ facility.phone }}
                </p>


                <a
                    href="https://www.google.com/maps/search/?api=1&query={{ facility.location | urlencode }}"
                    target="_blank"
                    class="btn btn-outline-primary"
                >
                    Get Directions
                </a>

            </div>

        </div>

    </div>

{% endfor %}

</div>

{% endblock %}
